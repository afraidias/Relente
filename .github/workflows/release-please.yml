# Opens and updates a release pull request from the Conventional Commits on main.
# Merging that pull request tags the version (vX.Y.Z) and creates the GitHub release.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v5.0.0 commit so the action can't change under us.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
